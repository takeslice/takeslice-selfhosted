name: takeslice

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeslice
      POSTGRES_PASSWORD: takeslice
      POSTGRES_DB: takeslice
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeslice -d takeslice"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://takeslice:takeslice@db:5432/takeslice
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://takeslice:takeslice@db:5432/takeslice
      APP_URL: ${APP_URL:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      target: migrator
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: postgres://takeslice:takeslice@db:5432/takeslice
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  app-data:
